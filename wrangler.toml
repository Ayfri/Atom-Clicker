name = "atom-clicker"
compatibility_date = "2026-08-26"
compatibility_flags = ["nodejs_compat"]
main = ".svelte-kit/cloudflare/_worker.js"
preview_urls = true
workers_dev = true

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

[observability]
enabled = true

# Server code only logs on failures, so without invocation logs a healthy request writes no log event at all and every error line is still kept.
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = false
persist = true

# Every Supabase call is a span and the leaderboard audit makes several per request, 1% is enough to read latencies.
[observability.traces]
enabled = true
head_sampling_rate = 0.01
persist = true

[observability.issues]
enabled = true
