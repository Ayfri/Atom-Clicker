# Local development configuration for Atom Clicker.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
#
# This file is trimmed on purpose: the game only uses Postgres (tables + RPCs),
# PostgREST and Auth (OAuth providers). Realtime, Storage, Edge Functions and
# Analytics are disabled so `supabase start` boots fewer containers and faster.
project_id = "Atom-Clicker-Svelte"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# Mirrors the 1000-entry cap used by the leaderboard route.
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
# Must match the remote project (Postgres 17.6).
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
# Vite dev server origin.
site_url = "http://localhost:5173"
additional_redirect_urls = [
	"http://localhost:5173/callback",
	"http://127.0.0.1:5173/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6

[auth.email]
# Production only signs in through OAuth, but email signup is kept on locally so a
# test user can be created from Studio without any external OAuth credentials.
enabled = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"

[auth.sms]
enabled = false
enable_confirmations = false

# OAuth providers offered in Login.svelte. They stay off by default because the CLI
# refuses to start with an enabled provider that has no credentials. Fill the matching
# variables in .env and flip `enabled` to test a real provider flow locally.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
# Required for local sign in with Google auth.
skip_nonce_check = true

[auth.external.discord]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_DISCORD_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_DISCORD_SECRET)"

[auth.external.twitter]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_TWITTER_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_TWITTER_SECRET)"

# Everything below is unused by the game and disabled to keep the local stack light.

[realtime]
enabled = false

[storage]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[local_smtp]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
